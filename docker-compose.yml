# docker compose up -d   ->  http://localhost:8000
services:
  open-dynamo:
    build: .
    image: open-dynamo
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      # How much one experiment may cost: equations x time steps x runs. Raise it on a bigger machine.
      OPENDYNAMO_MAX_WORK: "5e9"
      # Experiments (sweeps, Monte Carlo, fitting) running at the same time; others queue.
      OPENDYNAMO_JOBS: "2"
    volumes:
      - kernels:/home/dynamo/.cache/opendynamo    # compiled models survive a restart

volumes:
  kernels:
